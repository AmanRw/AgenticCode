[project]
name = "agentic-code"
version = "0.1.0"
description = "AgenticCode: End-to-End Autonomous GitHub Issue Resolution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.2.0",
    "fastapi>=0.142.2",
    "gitpython>=3.2.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.6.6",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pygithub>=2.10.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
agentic-code = "agentic_code.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
